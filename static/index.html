<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>ポケチャン ダメ計</title>
  <base id="base-tag">
  <link rel="manifest" href="manifest.json">
  <script src="js/shell.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>
    const base = document.createElement('base');
    base.href = location.pathname.replace(/\/[^/]*$/, '/');
    document.getElementById('base-tag').replaceWith(base);
  </script>
</head>
<body>
  <a class="skip-link" href="#page-calc">メイン画面へ</a>
  <header class="app-header">
    <a class="app-brand" href="./" aria-label="ポケチャン ダメ計 ホーム"><span class="brand-mark" aria-hidden="true">◒</span><span>ポケチャン</span></a>
    <div class="header-actions"><span class="app-version">v52</span><button type="button" id="theme-toggle" class="btn btn-outline" aria-label="表示モードを切り替え">表示</button></div>
  </header>
  <nav aria-label="メインメニュー">
    <button class="active" data-page="calc" aria-current="page"><span class="nav-label">ダメージ計算</span><span class="nav-short">計算</span></button>
    <button data-page="sim"><span class="nav-label">対戦シミュ</span><span class="nav-short">対戦</span></button>
    <button data-page="box"><span class="nav-label">BOX</span><span class="nav-short">BOX</span></button>
    <button data-page="team"><span class="nav-label">編成</span><span class="nav-short">編成</span></button>
    <button data-page="records"><span class="nav-label">対戦記録</span><span class="nav-short">記録</span></button>
    <button data-page="search"><span class="nav-label">検索</span><span class="nav-short">検索</span></button>
    <button data-page="dex"><span class="nav-label">図鑑</span><span class="nav-short">図鑑</span></button>
  </nav>
  <main tabindex="-1" class="page show" id="page-calc">データを読み込んでいます…</main>
  <main tabindex="-1" class="page" id="page-sim"></main>
  <main tabindex="-1" class="page" id="page-box"></main>
  <main tabindex="-1" class="page" id="page-team"></main>
  <main tabindex="-1" class="page" id="page-records"></main>
  <main tabindex="-1" class="page" id="page-search"></main>
  <script type="module" src="js/app.js"></script>
  <script src="debug-note.js" data-app="pokechampions-calc"></script>
</body>
</html>
